ext {
    minSdkVersion = 23
    /* 36, not 35, and not by choice.
       androidx.camera 1.6.1 arrives with @capgo/camera-preview 8 and refuses to compile
       against anything lower, which is also what forced the Android Gradle plugin to 8.9.1
       above. Both are consequences of taking white balance lock, and worth it: locking white
       balance is the half of the capture story exposure lock does not cover. */
    compileSdkVersion = 36
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}