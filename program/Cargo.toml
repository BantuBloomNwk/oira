[workspace]

[profile.release]
overflow-checks = true
opt-level = "z"
lto = "fat"
codegen-units = 1

[package]
name = "oira-palette"
version = "0.1.0"
description = "Oira Palette vault, private beauty/colour traits matched inside a MagicBlock Private ER (TEE)"
edition = "2021"
license = "MIT"
autotests = false

[lib]
crate-type = ["cdylib", "lib"]
name = "oira_palette"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test-helpers = []

[dependencies]
# Same proven versions as an earlier internal PER build (PER path verified on devnet).
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control"] }
solana-sha256-hasher = "=2.3.0"

[dev-dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
tokio = { version = "1", features = ["full"] }
