name: Devnet e2e (manual/scheduled)

# The slow tests, run by hand or once a week rather than on every push. They send real
# transactions to Solana devnet and MagicBlock, spend devnet SOL, and can fail because devnet
# is having a bad day rather than because something broke. Treat a run as a health check, not
# a merge gate, and read each step's own result.
#
# overnight-real-e2e is expected to fail for now: it runs short of devnet SOL partway through.
#
# Needs one repo secret, OIRA_DEPLOYER_KEY: the JSON array of a funded devnet keypair. Add it
# under Settings -> Secrets and variables -> Actions. Without it the whole suite skips.
on:
  workflow_dispatch: {} # manual trigger from the Actions tab or `gh workflow run`
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — cheap visibility, not meant to be tight

jobs:
  devnet-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Confirm the deployer secret is set
        run: |
          if [ -z "${{ secrets.OIRA_DEPLOYER_KEY }}" ]; then
            echo "OIRA_DEPLOYER_KEY is not set — skipping the whole devnet suite (nothing to fund it with)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Write the deployer key to every path/shape these scripts expect
        if: env.SKIP != '1'
        run: |
          mkdir -p keys
          # most e2e scripts (match-real-e2e, model-b-e2e, night-rules-e2e, overnight-real-e2e,
          # payout-e2e, perbrand-e2e, per-palette-e2e) read this exact path — confirmed by reading
          # the source, not assumed.
          printf '%s' '${{ secrets.OIRA_DEPLOYER_KEY }}' > keys/oira-deployer.json
        # env var form covers oira-chain.mjs's loadDeployer() (used by client/server.mjs, which
        # relay-ws-e2e.mjs needs running) and settle-match-e2e.mjs's OIRA_KEYPAIR (a file path,
        # a different convention from the others — pointed at the same file written above).
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: match-real-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/match-real-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: model-b-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/model-b-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: night-rules-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/night-rules-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: overnight-real-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/overnight-real-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: payout-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/payout-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: perbrand-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/perbrand-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: per-palette-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/per-palette-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: relay-seal-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/relay-seal-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: wallet-seal-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/wallet-seal-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: reseal-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/reseal-e2e.mjs
        env:
          OIRA_DEPLOYER_KEY: ${{ secrets.OIRA_DEPLOYER_KEY }}

      - name: settle-match-e2e
        if: env.SKIP != '1'
        working-directory: client
        run: node e2e/settle-match-e2e.mjs
        env:
          # relative to working-directory (client/), so ../keys — where the key was written (repo-root keys/)
          OIRA_KEYPAIR: ../keys/oira-deployer.json

      - name: relay-ws-e2e (needs the bridge server actually running)
        if: env.SKIP != '1'
        working-directory: client
        run: |
          OIRA_PORT=8779 OIRA_SERVE_STATIC=0 OIRA_DEPLOYER_KEY='${{ secrets.OIRA_DEPLOYER_KEY }}' node server.mjs &
          SERVER_PID=$!
          # give the bridge a moment to bind before the WS client tries to connect
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:8779/api/health >/dev/null && break; sleep 1; done
          node e2e/relay-ws-e2e.mjs
          RESULT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $RESULT
